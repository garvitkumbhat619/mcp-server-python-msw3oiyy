services:
  - type: web
    name: sla-risk-mcp
    runtime: python
    region: oregon
    plan: starter          # free tier — upgrade for production
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MCP_API_KEY
        sync: false        # tells Render: do NOT read from repo — set manually in dashboard
      - key: MODEL_PATH
        value: model/sla_breach_rf_v2.pkl
      - key: ENCODER_PATH
        value: model/feature_encoder.pkl
      - fromGroup: SLA Predictor MCP
    disk:
      name: model-storage
      mountPath: /opt/render/project/src/model
      sizeGB: 1
